services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nexus_atende
      POSTGRES_PASSWORD: ${NEXUS_ATENDE_DB_PASSWORD:?Defina NEXUS_ATENDE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, nexus_atende]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app, web]
    build: ./backend
    image: nexus-atende-backend:local
    environment: &backend_environment
      NEXUS_ATENDE_DATABASE_URL: ${NEXUS_ATENDE_DATABASE_URL:-}
      NEXUS_ATENDE_PUBLIC_ORIGIN: ${NEXUS_ATENDE_PUBLIC_ORIGIN:-}
      NEXUS_ATENDE_OPENWA_BASE_URL: ${NEXUS_ATENDE_OPENWA_BASE_URL:-}
      NEXUS_ATENDE_OPENWA_ALLOWED_URLS: ${NEXUS_ATENDE_OPENWA_ALLOWED_URLS:-}
      NEXUS_ATENDE_OPENWA_API_KEY: ${NEXUS_ATENDE_OPENWA_API_KEY:-}
      NEXUS_ATENDE_OPENWA_WEBHOOK_TENANT_ID: ${NEXUS_ATENDE_OPENWA_WEBHOOK_TENANT_ID:-}
      NEXUS_ATENDE_OPENWA_WEBHOOK_SECRET: ${NEXUS_ATENDE_OPENWA_WEBHOOK_SECRET:-}
      NEXUS_ATENDE_OPENAI_API_KEY: ${NEXUS_ATENDE_OPENAI_API_KEY:-}
      NEXUS_ATENDE_OPENAI_MODEL: ${NEXUS_ATENDE_OPENAI_MODEL:-gpt-4o-mini}
      NEXUS_ATENDE_OLLAMA_URL: ${NEXUS_ATENDE_OLLAMA_URL:-}
      NEXUS_ATENDE_CONFIG_KEY: ${NEXUS_ATENDE_CONFIG_KEY:-}
      NEXUS_ATENDE_RESEND_API_KEY: ${NEXUS_ATENDE_RESEND_API_KEY:-}
      NEXUS_ATENDE_RESEND_FROM: ${NEXUS_ATENDE_RESEND_FROM:-}
      NEXUS_ATENDE_RESEND_TO: ${NEXUS_ATENDE_RESEND_TO:-}
      NEXUS_ATENDE_KNOWLEDGE_URL_ORIGIN: ${NEXUS_ATENDE_KNOWLEDGE_URL_ORIGIN:-}
      FORWARDED_ALLOW_IPS: ${NEXUS_ATENDE_TRUSTED_PROXY_IPS:-127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEXUS_ATENDE_API_PORT:-8085}:8000"
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    profiles: [app]
    image: nexus-atende-backend:local
    command: [python, -m, src.worker]
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: [web]
    build: ./frontend
    image: nexus-atende-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEXUS_ATENDE_WEB_PORT:-3001}:3000"
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
